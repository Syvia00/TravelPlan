name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify-migrations:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # No .sln at repo root, so bare `dotnet restore`/`build` has no project to find (MSB1003).
      # Restoring/building TravelPlan.Api directly pulls in TravelPlan.Shared via its project
      # reference — TravelPlan.Web isn't needed for migration verification.
      - name: Restore
        run: dotnet restore TravelPlan.Api/TravelPlan.Api.csproj

      - name: Build
        run: dotnet build TravelPlan.Api/TravelPlan.Api.csproj --no-restore

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.*

      # Each provider gets its own DbContext subclass and its own Migrations/<Provider> folder
      # (see TravelPlan.Api/Data/TravelPlanSqliteDbContext.cs) because migrations bake in
      # provider-specific column types at scaffold time. This job is the "repeatable process"
      # that replaces the manual EnsureCreated+hand-baseline dance from Session 9: every PR
      # that changes the model must produce migrations that (a) apply cleanly against a fresh
      # database of EACH provider, and (b) leave no pending model changes for EITHER context.
      # A migration that only works for one provider fails the build here, not in production.

      - name: Verify SQLite migrations apply cleanly
        working-directory: TravelPlan.Api
        run: |
          dotnet ef database update --context TravelPlanSqliteDbContext \
            --connection "Data Source=${{ runner.temp }}/ci-verify.db"

      - name: Verify no pending model changes (SQLite)
        working-directory: TravelPlan.Api
        run: dotnet ef migrations has-pending-model-changes --context TravelPlanSqliteDbContext

      - name: Verify SQL Server migrations apply cleanly
        working-directory: TravelPlan.Api
        env:
          TRAVELPLAN_SQLSERVER_DESIGNTIME_CONNECTION: "Server=tcp:localhost,1433;Initial Catalog=TravelPlanDbCi;User ID=sa;Password=${{ secrets.CI_MSSQL_SA_PASSWORD }};TrustServerCertificate=True;"
        run: |
          dotnet ef database update --context TravelPlanSqlServerDbContext \
            --connection "$TRAVELPLAN_SQLSERVER_DESIGNTIME_CONNECTION"

      - name: Verify no pending model changes (SQL Server)
        working-directory: TravelPlan.Api
        env:
          TRAVELPLAN_SQLSERVER_DESIGNTIME_CONNECTION: "Server=tcp:localhost,1433;Initial Catalog=TravelPlanDbCi;User ID=sa;Password=${{ secrets.CI_MSSQL_SA_PASSWORD }};TrustServerCertificate=True;"
        run: dotnet ef migrations has-pending-model-changes --context TravelPlanSqlServerDbContext

  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # TravelPlan.Tests targets a real relational provider (SQLite, via an in-memory connection
      # kept open for each test's lifetime — see TripAccessServiceTests) rather than EF Core's
      # InMemory provider, specifically so a role comparison written inside a LINQ-to-Entities
      # query still gets translated into and executed as real SQL. That's the only way these tests
      # could have caught the Session 6.8 bug (a string-typed Role column made ">=" compare
      # alphabetically instead of numerically) — confirmed by temporarily reintroducing that exact
      # bug locally and watching two of these tests fail with precisely the expected mismatches
      # before this workflow step was added. No service container needed: unlike the SQL Server
      # migration checks above, SQLite here needs nothing running alongside the job.
      - name: Restore
        run: dotnet restore TravelPlan.Tests/TravelPlan.Tests.csproj

      - name: Test
        run: dotnet test TravelPlan.Tests/TravelPlan.Tests.csproj --no-restore
